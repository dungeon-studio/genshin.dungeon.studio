# SPDX-FileCopyrightText: 2026 Alex Brandt <alunduil@gmail.com>
# SPDX-License-Identifier: MIT

# Pre-commit hooks for code quality and consistency
# See https://pre-commit.com for more information

# Global excludes - never touch these directories with any hook
exclude: |
  (?x)^(
    \.styles/(?!config)|    # Vale vendor files (exclude all of .styles/ except .styles/config/)
    node_modules/|          # Dependencies
    \.pnpm-store/|          # pnpm cache
    dist/|                  # Build output
    build/|                 # Build output
    \.turbo/|               # Turborepo cache
    pnpm-lock\.yaml         # Package lockfile
  )

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # File formatting
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

      # Syntax validation
      - id: check-yaml
        args: [--unsafe] # Allow custom YAML tags
      - id: check-json
        exclude: '\.jsonc$|\.vscode/|tsconfig|\.devcontainer/' # Skip JSONC files and dirs with JSON-with-comments

      # Prevent issues
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks

      # Git hygiene
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, main]

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # Without -x, the .devcontainer entrypoints report lib.sh as
        # unresolvable instead of checking against it.
        args: [-x]

  # Shell script formatting
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        # Keep --write. It is one of the hook's default args, and pre-commit
        # replaces those wholesale rather than appending; without it shfmt
        # writes to stdout and exits 0 on files it would have rewritten.
        args: [--write, -i, '2', -ci]

  # Vale - Prose linting
  - repo: https://github.com/errata-ai/vale
    rev: v3.17.1
    hooks:
      - id: vale
        args: [--config=.vale.ini]
        types: [markdown]

  # Terraform - Infrastructure as Code
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
        args: [--args=-recursive]
      - id: terraform_trivy
        args:
          - --args=--severity=HIGH,CRITICAL

  # REUSE - SPDX license compliance
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        always_run: true

  # GitHub Actions static analysis. Offline gate here; online supply-chain
  # audits need a token and run in ci.yml's workflows job.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: [--no-progress, --offline]

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  # Renovate config validation
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.33.2
    hooks:
      - id: renovate-config-validator
        args: [--strict, --no-global]

  # Local hooks using package.json-managed tools. Kept local (not via
  # remote pre-commit repos) so versions stay aligned with package.json
  # and aren't perturbed by pre-commit autoupdate.
  - repo: local
    hooks:
      # Delegated to turbo rather than handed the staged files, because eslint
      # is only correct with the consuming workspace as its working directory
      # and its dependencies built. From the root it resolves neither: the
      # `@/*` aliases in a workspace tsconfig go unresolved, and unbuilt
      # sibling `dist/` leaves type-aware rules seeing `any`. Both report
      # findings that `eslint .` in the workspace does not. That rules out
      # `--fix` as well — turbo caches on inputs and `lint` declares no
      # outputs, so a cache hit would replay the log without rewriting
      # anything. Run `pnpm lint -- --fix` to apply the autofixes.
      - id: eslint
        name: eslint
        entry: pnpm exec turbo run lint
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: false

      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css]

      - id: stylelint
        name: stylelint
        entry: pnpm exec stylelint
        language: system
        types: [css]
        args: [--fix]

      - id: typescript-check
        name: typescript type check
        entry: pnpm exec turbo run typecheck
        language: system
        types_or: [ts, tsx]
        pass_filenames: false

      # knip analyzes the whole workspace graph, so it can't be file-scoped and
      # runs on every commit.
      - id: knip
        name: knip (unused files, dependencies, exports)
        entry: pnpm exec knip
        language: system
        pass_filenames: false
        always_run: true

      # Offline resolves on-disk paths and makes no network request, so it
      # gates every commit and every pull request. The weekly external sweep
      # stays an action for its issue reporting. Upstream's auto-installing
      # hook is unusable here: cargo-binstall fetches a glibc build that needs
      # GLIBC_2.38, newer than some contributor machines.
      - id: lychee
        name: lychee (internal links)
        entry: lychee --offline --no-progress
        language: system
        types: [markdown]

      # ls-lint's ignore list filters its findings but does not prune its walk,
      # so it traverses node_modules to validate the tracked files and takes
      # seconds rather than milliseconds.
      - id: ls-lint
        name: file naming conventions
        entry: pnpm exec ls-lint
        language: system
        pass_filenames: false
        always_run: true

      - id: vscode-extensions
        name: devcontainer and editor extensions in sync
        entry: pnpm vscode-extensions:check
        language: system
        files: ^(\.vscode/extensions\.json|\.devcontainer/devcontainer\.json)$
        pass_filenames: false

      - id: syncpack
        name: exact dependency versions
        entry: pnpm exec syncpack lint
        language: system
        files: (^|/)package\.json$
        pass_filenames: false

      # Keeps the committed JSON Schema snapshots faithful to their Zod source — a
      # pure function of the working tree, unlike the base-branch compatibility
      # proof, which is a PR-level check in ci.yml. Runs through turbo so the
      # workspace packages the schemas import build first.
      - id: schema-snapshots
        name: schema snapshots (regenerate from Zod)
        entry: pnpm exec turbo run schemas:export
        language: system
        files: ^apps/[^/]+/(src/.+/schemas/|schema-snapshots/)
        pass_filenames: false
