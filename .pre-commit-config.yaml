# SPDX-FileCopyrightText: 2026 Alex Brandt <alunduil@gmail.com>
# SPDX-License-Identifier: MIT

exclude: |
  (?x)^(
    \.styles/(?!config)|    # Vale syncs packages here; only config/ is ours
    pnpm-lock\.yaml
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

      - id: check-yaml
      - id: check-json
        # These formats permit comments.
        exclude: '\.vscode/|tsconfig|\.devcontainer/'
      - id: check-toml

      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-shebang-scripts-are-executable
        # tsc copies this shebang into the emitted bin; the source never runs.
        exclude: ^tools/game-data-codegen/src/cli\.ts$
      - id: check-executables-have-shebangs
      - id: detect-private-key

      - id: no-commit-to-branch
        args: [--branch, develop, --branch, main]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # Without -x, the .devcontainer entrypoints report lib.sh as
        # unresolvable instead of checking against it.
        args: [-x]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        # Setting args replaces the hook's defaults, --write among them; without
        # it shfmt prints the fix to stdout and exits 0.
        args: [--write, -i, '2', -ci]

  - repo: https://github.com/errata-ai/vale
    rev: v3.24.0
    hooks:
      - id: vale
        args: [--config=.vale.ini]
        types: [markdown]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.3
    hooks:
      - id: terraform_fmt
        args: [--args=-recursive]
      - id: terraform_validate
        # Validate never reads state, so it skips the GCS backend and the
        # credentials it needs.
        args: [--tf-init-args=-backend=false]
      - id: terraform_trivy
        args:
          - --args=--severity=HIGH,CRITICAL

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        always_run: true

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        # Online audits need a token, so they run in ci.yml's workflows job.
        args: [--no-progress, --offline]
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      # actionlint skips shellcheck when it isn't on PATH. Renovate tracks
      # additional_dependencies only on hooks that declare a language.
      - id: actionlint
        language: python
        additional_dependencies: [shellcheck-py==0.11.0.1]

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.190.1
    hooks:
      - id: renovate-config-validator
        args: [--strict, --no-global]

  # `pnpm exec` runs the package.json pin, so pre-commit autoupdate can't
  # move a tool out of step with it.
  - repo: local
    hooks:
      # eslint needs the workspace as its working directory and the
      # workspace's dependencies built. From the root, `@/*` aliases don't
      # resolve and type-aware rules see unbuilt siblings as `any`. Turbo
      # provides both. A turbo cache hit replays the log without rewriting
      # files, so `--fix` can't go here. `--max-warnings=0` sits in each
      # workspace's `lint` script so a direct `turbo run lint` enforces it too.
      #
      # No file matcher: turbo.json decides staleness, and its `lint` inputs
      # reach past the module extensions.
      - id: eslint
        name: eslint (all workspaces)
        entry: pnpm exec turbo run lint
        language: system
        pass_filenames: false
        always_run: true

      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write
        language: system
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css]

      - id: stylelint
        name: stylelint
        entry: pnpm exec stylelint
        language: system
        types: [css]
        args: [--fix, --max-warnings, '0']

      # No file matcher: turbo.json decides staleness, and its `typecheck`
      # inputs reach past the module extensions.
      - id: typescript-check
        name: typescript type check (all workspaces)
        entry: pnpm exec turbo run typecheck
        language: system
        pass_filenames: false
        always_run: true

      # knip analyzes the whole workspace graph, so it can't be file-scoped.
      - id: knip
        name: knip (unused files, dependencies, exports)
        entry: pnpm exec knip
        language: system
        pass_filenames: false
        always_run: true

      # Offline mode makes no network request, so it can gate commits;
      # weekly.yml checks external links and files an issue. Upstream's hook installs through
      # cargo-binstall, whose glibc build is newer than some contributor
      # machines have.
      - id: lychee
        name: lychee (internal links)
        entry: lychee --offline --no-progress
        language: system
        types: [markdown]

      # ls-lint walks node_modules despite its ignore list, so it takes
      # seconds.
      - id: ls-lint
        name: file naming conventions
        entry: pnpm exec ls-lint
        language: system
        pass_filenames: false
        always_run: true

      # Vite deploys apps/web/public/ verbatim, so every file there is public.
      - id: web-public-images-only
        name: only images in apps/web/public
        entry: only .png and .ico files belong in apps/web/public; put asset notes in apps/web/provenance
        language: fail
        files: ^apps/web/public/
        exclude: \.(png|ico)$

      - id: vscode-extensions
        name: devcontainer and editor extensions in sync
        entry: pnpm vscode-extensions:check
        language: system
        files: ^(\.vscode/extensions\.json|\.devcontainer/devcontainer\.json)$
        pass_filenames: false

      - id: syncpack
        name: exact dependency versions
        entry: pnpm exec syncpack lint
        language: system
        files: (^|/)package\.json$
        pass_filenames: false

      # Turbo builds the workspace packages the schemas import before export.
      # Compatibility with the base branch is a ci.yml job.
      - id: schema-snapshots
        name: schema snapshots (regenerate from Zod)
        entry: pnpm exec turbo run schemas:export
        language: system
        files: |
          (?x)^(
            [^/]+/[^/]+/(src/.+/schemas/|scripts/schema-registry\.ts$|schema-snapshots/)
            | tools/schema-snapshots/src/
          )
        pass_filenames: false

      # Pillow matches the pin in the generator's script metadata.
      - id: brand-assets
        name: brand assets (regenerate from environments)
        entry: python apps/web/scripts/generate-brand-assets.py
        language: python
        additional_dependencies: [pillow==13.0.0]
        files: |
          (?x)^apps/web/(
            scripts/generate-brand-assets\.py|
            src/lib/environments\.json|
            public/(favicon|icon|og-image)[^/]*\.(png|ico)
          )$
        pass_filenames: false

      # The generators import @genshin/game-data, so its sources are inputs too.
      - id: game-data
        name: game data (regenerate from genshin-db)
        entry: scripts/regenerate-game-data.sh
        language: script
        files: ^(tools/game-data-codegen/|packages/game-data/src/|scripts/regenerate-game-data\.sh$)
        pass_filenames: false
