<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan your Genshin Impact teams and manage your collection." />
    <meta name="theme-color" content="#1f514e" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-32x32.png"
      sizes="32x32"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-32x32-dark.png"
      sizes="32x32"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Genshin Planner | genshin.dungeon.studio</title>

    <!-- Authored for production; src/lib/environment-branding.ts rewrites the
         origin and title for every other environment. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Genshin Planner" />
    <meta property="og:title" content="Genshin Planner" />
    <meta
      property="og:description"
      content="Plan your Genshin Impact teams and manage your collection."
    />
    <meta property="og:url" content="https://genshin.dungeon.studio/" />
    <meta property="og:image" content="https://genshin.dungeon.studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Genshin Planner" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
        } catch (e) {
          var stored = null;
        }
        if (stored !== 'light' && stored !== 'dark') stored = null;
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
