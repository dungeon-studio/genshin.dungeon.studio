---
# Trivy configuration for infrastructure scanning
# See https://aquasecurity.github.io/trivy/ for documentation

severity:
  - HIGH
  - CRITICAL
exit-code: 1

scan:
  scanners:
    - misconfig

misconfiguration:
  terraform:
    vars:
      - infrastructure/terraform/environments/dev/terraform.tfvars

# Listing a licence under a category replaces Trivy's built-in list for it.
# `permissive` has no built-in list, so it takes the additions.
license:
  permissive:
    - BlueOak-1.0.0
    - MIT-0

ignorefile: .trivyignore.yaml
