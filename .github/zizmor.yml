---
rules:
  ref-version-mismatch:
    # SHA pins carry a major-version comment (# v6) by house convention; this
    # audit wants the exact patch tag (# v6.0.2), which Renovate rewrites on the
    # next bump. Comment hygiene, not a security signal, so opt out repo-wide.
    disable: true

  self-repository:
    # actionlint rejects the `$/` form this audit asks for until
    # rhysd/actionlint#711 ships; #1529 tracks the migration.
    disable: true

  cache-poisoning:
    # The ci.yml jobs that restore caches publish nothing. Publishing happens in
    # deploy.yml, which zizmor audits on its own. GitHub scopes cache writes to
    # the writing branch, so a pull request cannot write into the scope a
    # develop or main run restores from.
    ignore:
      - ci.yml

  secrets-inherit:
    # Environment secrets cannot be passed by name: only the reusable declares
    # `environment:`, so the caller has no handle on them and must inherit.
    ignore:
      - ci.yml
      - terraform-apply.yml
