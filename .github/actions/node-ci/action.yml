name: Node CI
description: Install Node.js + pnpm, typecheck, test with coverage, upload results to Codecov, and build

inputs:
  filter:
    description: 'Turborepo filter (e.g. @genshin/api)'
    required: true
  coverage-file:
    description: 'Path to lcov.info coverage file'
    required: true
  results-file:
    description: 'Path to junit.xml test results file'
    required: true
  flag:
    description: 'Codecov flag name'
    required: true
  codecov-token:
    description: 'Codecov upload token'
    required: true

runs:
  using: composite

  steps:
    - uses: ./.github/actions/setup-node-pnpm

    # Persist turbo's local cache so unchanged packages skip rebuilds across
    # runs. GitHub cache entries are write-once per key, so a stable key would
    # freeze after the first save; the per-commit key saves a fresh entry each
    # run while the prefix restore-key restores the leg's most recent one.
    # Per-leg scoping keeps parallel legs from racing a shared key.
    - name: Cache Turborepo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ inputs.flag }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ inputs.flag }}-

    - name: Typecheck
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: pnpm turbo run typecheck --filter="$FILTER"

    # Seed property-based tests from the commit under test: a re-run of the same
    # commit replays identical inputs (so a failure reproduces), while a new
    # commit or PR draws fresh inputs (so the generators keep exploring). The
    # first 8 hex digits of the SHA become a 32-bit integer seed.
    - name: Derive fast-check seed
      shell: bash
      env:
        SEED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      # SEED_SOURCE is a commit SHA (trusted, hex), not attacker-controlled;
      # low-confidence finding tracked for recheck in #910.
      run: echo "FAST_CHECK_SEED=$((16#${SEED_SOURCE:0:8}))" >> "$GITHUB_ENV" # zizmor: ignore[github-env]

    - name: Test
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
      run: pnpm turbo run test --filter="$FILTER" -- --coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ inputs.codecov-token }}
        files: ${{ inputs.coverage-file }}
        flags: ${{ inputs.flag }}
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ inputs.codecov-token }}
        files: ${{ inputs.results-file }}
        flags: ${{ inputs.flag }}
        report_type: test_results
        fail_ci_if_error: false

    # apps/web fails the build when its Firebase config is missing, so that a
    # deployed bundle can never fall back to the local-emulator placeholders in
    # lib/firebase.ts. This build only proves the app compiles and its output is
    # discarded, so any non-empty value satisfies it. Deployed bundles come from
    # the separate build step in deploy.yml, which injects the real config.
    - name: Build
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
        VITE_API_BASE_URL: https://api.invalid
        VITE_FIREBASE_API_KEY: ci
        VITE_FIREBASE_AUTH_DOMAIN: ci.invalid
        VITE_FIREBASE_PROJECT_ID: ci
        VITE_FIREBASE_STORAGE_BUCKET: ci.invalid
        VITE_FIREBASE_MESSAGING_SENDER_ID: ci
        VITE_FIREBASE_APP_ID: ci
      run: pnpm turbo run build --filter="$FILTER"
