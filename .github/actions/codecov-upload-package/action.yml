name: Codecov package upload
description: Upload one package's coverage and test results under its own flag

inputs:
  codecov-token:
    description: 'Codecov upload token'
    required: true
  directory:
    description: 'Package directory holding coverage/lcov.info and test-results/junit.xml'
    required: true
  flag:
    description: 'Codecov flag the package reports under'
    required: true

runs:
  using: composite

  steps:
    - name: Upload coverage
      uses: ./.github/actions/codecov-upload
      with:
        codecov-token: ${{ inputs.codecov-token }}
        files: ${{ inputs.directory }}/coverage/lcov.info
        flag: ${{ inputs.flag }}

    # A failed coverage upload must not suppress the test results.
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: ./.github/actions/codecov-upload
      with:
        codecov-token: ${{ inputs.codecov-token }}
        files: ${{ inputs.directory }}/test-results/junit.xml
        flag: ${{ inputs.flag }}
        report_type: test_results
