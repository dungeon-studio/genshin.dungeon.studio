name: Codecov upload
description: Upload one coverage or test-results report to Codecov under one flag

# A failed upload leaves the job green. Confirm an upload from the uploader's
# output, not the check.

inputs:
  codecov-token:
    description: 'Codecov upload token'
    required: true
  files:
    description: 'Report file to upload'
    required: true
  flag:
    description: 'Codecov flag the report belongs to'
    required: true
  report_type:
    description: 'test_results for a JUnit report; empty uploads coverage'
    required: false
    default: ''

runs:
  using: composite

  steps:
    - name: Upload to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ inputs.codecov-token }}
        files: ${{ inputs.files }}
        flags: ${{ inputs.flag }}
        report_type: ${{ inputs.report_type }}
        fail_ci_if_error: false
