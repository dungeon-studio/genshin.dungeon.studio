name: Setup Node.js and pnpm
description: Install Node.js, pnpm, and any other tools the job needs from mise.toml, and restore dependency cache

inputs:
  tools:
    description: >-
      Space-separated mise.toml tool keys to install alongside Node.js and
      pnpm, spelled as the key appears there (for example
      `github:lycheeverse/lychee`)
    required: false
    default: ''

runs:
  using: composite

  steps:
    - name: Install tools
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        install_args: node pnpm ${{ inputs.tools }}

    - name: Get pnpm store directory
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Setup pnpm cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        # Root-anchored (not `**/`): there is a single lockfile at the repo
        # root, so the hash is identical, but the jobs that run `pnpm dev`
        # (dev-smoke, e2e) leave the workspace tree churning as the emulator
        # stack tears down. A `**/` walk at post-job cache time races those
        # deletions and fails with "Fail to hash files under directory";
        # hashing one known file sidesteps the walk entirely.
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
