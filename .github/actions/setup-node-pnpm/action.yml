name: Setup Node.js and pnpm
description: Install Node.js, pnpm (version from package.json), and restore dependency cache

runs:
  using: composite

  steps:
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        # Single source of truth for the Node toolchain version (CI, the
        # devcontainer, and `nvm use`). Renovate's nvm manager keeps .nvmrc
        # current; the `node` group in renovate.json bumps it in lockstep with
        # the devcontainer feature.
        node-version-file: .nvmrc

    - name: Install pnpm
      uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a # v6
      with:
        run_install: false

    - name: Get pnpm store directory
      shell: bash
      # STORE_PATH is pnpm's own store path (trusted), not attacker-controlled;
      # low-confidence finding tracked for recheck in #910.
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV" # zizmor: ignore[github-env]

    - name: Setup pnpm cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
