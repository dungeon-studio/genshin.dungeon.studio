name: Diff against the base
description: Report whether any of the given paths differ from the base commit

# The calling job checks out with `fetch-depth: 2`. `git diff --quiet` exits
# nonzero on error as well as on a difference, so a failed diff runs the gated
# work.

inputs:
  paths:
    description: 'Pathspecs to compare, one per line'
    required: true

outputs:
  changed:
    description: "'true' when any pathspec differs from the base, else 'false'"
    value: ${{ steps.diff.outputs.changed }}

runs:
  using: composite

  steps:
    - name: Diff against the base
      id: diff
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
      run: |
        mapfile -t paths < <(printf '%s' "${PATHS}")
        if git diff --quiet HEAD^1 HEAD -- "${paths[@]}"; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
