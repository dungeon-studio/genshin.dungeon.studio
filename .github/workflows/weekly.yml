---
name: Weekly

on:
  schedule:
    # Fridays at 18:00 Europe/London. The timezone field (GitHub Actions
    # support added March 2026) handles BST/GMT automatically.
    - cron: '0 18 * * 5'
      timezone: Europe/London
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ref-less group so a manual dispatch and the schedule can't race on the
  # shared report issue.
  group: ${{ github.workflow }}

jobs:
  # External URLs rot independently of our changes, so checking them per-PR
  # produces flaky failures. Verify them weekly and open an issue when
  # something breaks rather than blocking a PR. Never blocks.
  external-links:
    name: Check external links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    env:
      # renovate: datasource=github-releases depName=lycheeverse/lychee extractVersion=^lychee-v(?<version>.+)$
      LYCHEE_VERSION: '0.24.2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # musl, so the binary is static and carries no glibc floor.
      - name: Install lychee
        run: |
          set -euo pipefail
          LYCHEE_URL=https://github.com/lycheeverse/lychee/releases/download
          LYCHEE_DIR=lychee-x86_64-unknown-linux-musl
          curl -fsSL \
            "${LYCHEE_URL}/lychee-v${LYCHEE_VERSION}/${LYCHEE_DIR}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "${LYCHEE_DIR}/lychee"

      # Broken links open a report issue instead of failing the job.
      - name: Check all links
        id: lychee
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exit_code=0
          lychee --no-progress --format markdown --output lychee-report.md '**/*.md' \
            || exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Report broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: ./.github/actions/report-issue
        with:
          title: Link Checker Report
          content-filepath: ./lychee-report.md
          labels: documentation

  # Stryker reruns the suite once per mutant, and the score shifts under
  # legitimate refactoring, so survivors update one report issue instead of
  # gating a pull request. Never blocks.
  mutation-score:
    name: Report mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      PACKAGE: packages/domain

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run mutation tests
        run: pnpm turbo run test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: ${{ env.PACKAGE }}/reports/mutation/

      - name: Summarise surviving mutants
        id: summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="${PACKAGE}/reports/mutation/mutation.json"
          survivors=$(jq '[.files[].mutants[].status | select(IN("Survived", "NoCoverage"))] | length' "${report}")
          echo "survivors=${survivors}" >> "${GITHUB_OUTPUT}"
          jq -r --arg package "${PACKAGE}" --arg run "${RUN_URL}" '
            def surviving: .status | IN("Survived", "NoCoverage");
            def detected: map(select(.status | IN("Killed", "Timeout"))) | length;
            def valid: map(select(.status | IN("CompileError", "RuntimeError", "Ignored") | not)) | length;
            def score: if valid == 0 then "n/a" else "\((detected * 10000 / valid | round) / 100)%" end;
            def count($status): map(select(.status == $status)) | length;
            def files: .files | to_entries | sort_by(.key)[] | {file: .key, mutants: .value.mutants};
            "Mutation score for `\($package)`: **\([.files[].mutants[]] | score)**",
            "",
            "| File | Score | Survived | No coverage |",
            "| --- | ---: | ---: | ---: |",
            (files | select(any(.mutants[]; surviving))
              | ["`\(.file)`", (.mutants | score, count("Survived"), count("NoCoverage"))]
              | "| \(join(" | ")) |"),
            "",
            "<details><summary>Surviving mutants</summary>",
            "",
            (files | .file as $file | .mutants | sort_by(.location.start.line)[] | select(surviving)
              | "- `\($file):\(.location.start.line)` \(.mutatorName) (\(.status))"),
            "",
            "</details>",
            "",
            "The full report is the `mutation-report` artifact on [the run](\($run))."
          ' "${report}" > mutation-report.md

      - name: Report surviving mutants
        if: steps.summary.outputs.survivors != '0'
        uses: ./.github/actions/report-issue
        with:
          title: Mutation Testing Report
          content-filepath: ./mutation-report.md
          labels: domain
