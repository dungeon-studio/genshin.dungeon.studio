name: Devcontainer

# A cold devcontainer build is expensive, so the gate lists only the image's
# build inputs that ci.yml doesn't already exercise. The anchor keeps both
# triggers on one list, which two copies would let drift.
on:
  pull_request:
    paths: &paths
      - '.devcontainer/**'
      - 'scripts/install-reuse.sh'
      - 'scripts/install-lychee.sh'
      - '.github/workflows/devcontainer.yml'
      # packageManager, engines, and the firebase-tools pin.
      - 'package.json'
      # The Playwright pin the browsers install from.
      - 'tools/e2e/package.json'
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
    paths: *paths

permissions:
  contents: read

jobs:
  toolchain:
    name: Verify toolchain
    runs-on: ubuntu-latest
    # Headroom for a cold build, which has no cache to fall back on.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image and verify its toolchain
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: genshin-planner-devcontainer
          push: never
          # The action starts the container only when runCmd is set. Starting
          # it runs postCreateCommand.sh, which verifies the toolchain.
          # Project-wide checks belong in .pre-commit-config.yaml.
          runCmd: 'true'
