name: Devcontainer

# A cold devcontainer build is expensive, hence the path gate: it lists only
# what the image build consumes. Root package.json carries packageManager,
# engines, and the firebase-tools pin; tools/e2e/package.json carries the
# Playwright pin the browsers install from. pnpm-lock.yaml stays out because
# ci.yml already installs from it on every pull request. The anchor keeps both
# triggers on one list, which two copies would let drift.
on:
  pull_request:
    paths: &paths
      - '.devcontainer/**'
      - 'scripts/install-reuse.sh'
      - '.github/workflows/devcontainer.yml'
      - 'package.json'
      - 'tools/e2e/package.json'
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
    paths: *paths

permissions:
  contents: read

jobs:
  toolchain:
    name: Verify toolchain
    runs-on: ubuntu-latest
    # Headroom for a cold build, which has no cache to fall back on.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image and run the checks inside it
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: genshin-planner-devcontainer
          push: never
          # The action starts the container only when runCmd is set, and the
          # start runs postCreateCommand.sh, whose verify_toolchain is the
          # check. Project-wide checks belong in .pre-commit-config.yaml.
          runCmd: 'true'
