---
# SPDX-FileCopyrightText: 2026 Alex Brandt <alunduil@gmail.com>
# SPDX-License-Identifier: MIT

name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - '.github/workflows/deploy.yml'
      - '.github/actions/setup-node-pnpm/**'
      - '.github/actions/setup-playwright/**'

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
  TERRAFORM_VERSION: '1.15.8'

# Only one deploy per ref at a time. Cloud Run and the `:develop` image tag
# are single mutable targets, so concurrent runs race: an older run's health
# verification sees a newer run's SHA and fails with sha_mismatch. Cancelling
# superseded runs deploys only the latest commit.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.ref == 'refs/heads/develop'
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    env:
      GCP_PROJECT_ID: dungeon-studio-genshin-dev
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_RW_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_RW_DEV_SERVICE_ACCOUNT_EMAIL }}

      - uses: ./.github/actions/setup-node-pnpm

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Read Firebase Config from Terraform
        id: firebase-config
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform init -backend=true -input=false
          bash "$GITHUB_WORKSPACE/apps/web/scripts/firebase-config-to-outputs.sh"

      - name: Build
        run: pnpm turbo run build --filter=@genshin/web
        env:
          VITE_API_BASE_URL: https://api.develop.genshin.dungeon.studio
          VITE_FIREBASE_API_KEY: ${{ steps.firebase-config.outputs.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ steps.firebase-config.outputs.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ steps.firebase-config.outputs.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ steps.firebase-config.outputs.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ steps.firebase-config.outputs.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ steps.firebase-config.outputs.VITE_FIREBASE_APP_ID }}

      - name: Verify Build
        run: bash apps/web/scripts/verify-build-output.sh

      - name: Deploy
        run: pnpm exec firebase deploy --only hosting --project "$GCP_PROJECT_ID"
        working-directory: apps/web

      - name: Verify
        run: bash apps/web/scripts/verify-deployment.sh "https://develop.genshin.dungeon.studio"

  api:
    if: github.ref == 'refs/heads/develop'
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      GCP_DEV_PROJECT_ID: dungeon-studio-genshin-dev
      CLOUD_RUN_REGION: europe-west1
      CLOUD_RUN_SERVICE_NAME: api
      ARTIFACT_REPOSITORY: api
      FRONTEND_ORIGIN: https://develop.genshin.dungeon.studio
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_RW_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_RW_DEV_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker Auth
        run: gcloud auth configure-docker "${CLOUD_RUN_REGION}-docker.pkg.dev" --quiet

      - name: Setup Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ env.GCP_DEV_PROJECT_ID }}/${{
            env.ARTIFACT_REPOSITORY }}/${{ env.CLOUD_RUN_SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short

      - name: Build & Push Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve Image
        id: image
        run: |
          BRANCH_NAME=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's|/|-|g')
          IMAGE_URI="${CLOUD_RUN_REGION}-docker.pkg.dev/${GCP_DEV_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${CLOUD_RUN_SERVICE_NAME}:${BRANCH_NAME}-${GITHUB_SHA::7}"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Log Tags & Image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          echo "Published image tags:"
          printf '%s\n' "$IMAGE_TAGS"
          echo "Deploy image URI: $IMAGE_URI"

      # Service lifecycle is intentionally CI-managed for fast app rollouts.
      # Terraform in dev manages supporting infra (APIs, Artifact Registry,
      # and domain mapping), but does not define the Cloud Run service itself.
      # This split is intentional and may diverge further for release/prod.
      - name: Deploy
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          project_id: ${{ env.GCP_DEV_PROJECT_ID }}
          region: ${{ env.CLOUD_RUN_REGION }}
          service: ${{ env.CLOUD_RUN_SERVICE_NAME }}
          image: ${{ steps.image.outputs.image_uri }}
          flags: >-
            --allow-unauthenticated
            --cpu=1
            --memory=512Mi
            --concurrency=80
          env_vars: |
            FRONTEND_ORIGIN=${{ env.FRONTEND_ORIGIN }}
            APP_GIT_SHA=${{ github.sha }}

      - name: Verify Public Health
        continue-on-error: true
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: >-
          curl -fsSL "$SERVICE_URL/health"
          | jq -e '.status == "ok"'

      # Whether the middleware honours its configuration is a unit test in
      # app.test.ts. What only a deployed service can answer is whether it got
      # the configuration: FRONTEND_ORIGIN falling out of the deploy is silent,
      # because app.ts defaults to localhost, leaving a service that passes
      # every health check while refusing every real browser.
      - name: Verify CORS Origin
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          allowed=$(curl -fsS -o /dev/null -H "Origin: $FRONTEND_ORIGIN" \
            -w '%header{access-control-allow-origin}' "$SERVICE_URL/health")
          test "$allowed" = "$FRONTEND_ORIGIN" || {
            echo "expected $FRONTEND_ORIGIN, got '${allowed:-<none>}'" >&2
            exit 1
          }

      - uses: ./.github/actions/setup-node-pnpm

      - name: Generate Verify Token
        id: verify-token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_RW_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_RW_DEV_SERVICE_ACCOUNT_EMAIL }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}

      - name: Verify Authenticated Health
        env:
          HEALTH_BEARER_TOKEN: ${{ steps.verify-token.outputs.id_token }}
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm --filter @genshin/api exec tsx scripts/verify-deployment.ts "$SERVICE_URL"

  # Executes the published app in a browser, which nothing else does:
  # verify-deployment.sh compares a static version.json that reports correctly
  # on a site that never boots, and the PR-time e2e suite drives a dev server
  # wired to emulators rather than a production bundle.
  #
  # Its own job, gated on both deploys, because the conclusion is read per-SHA
  # when promoting a version onward: it has to name the tests rather than a
  # build or a Firebase outage.
  e2e:
    if: github.ref == 'refs/heads/develop'
    name: Run end-to-end tests against the deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [web, api]

    env:
      DEPLOYED_BASE_URL: https://develop.genshin.dungeon.studio

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-playwright

      # Not through turbo: these specs reach for no workspace package, so there
      # is no build to order ahead of them.
      - name: Run end-to-end tests
        run: pnpm --filter @genshin/e2e test:deployed

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: /tmp/genshin-deployed
          retention-days: 7
