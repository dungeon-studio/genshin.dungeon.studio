---
name: CI

# Every sensor that runs unconditionally on an integration event. Path-gated
# checks have a narrower "when" and keep their own files; see
# docs/reference/code-conventions.md for the naming rule.

# The push set is every git-flow branch whose merge result ships or gets
# inherited, since no merge result was itself tested before it landed. Feature
# branches are absent deliberately: the pull_request trigger gates those.
on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs; never cancel a push to a long-lived
  # branch, so every commit on it keeps a result of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.display }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - display: Web
            filter: '@genshin/web'
            path-prefix: apps/web
            flag: web
          - display: API
            filter: '@genshin/api'
            path-prefix: apps/api
            flag: api
          - display: Game Data
            filter: '@genshin/game-data'
            path-prefix: packages/game-data
            flag: game-data
          - display: Domain
            filter: '@genshin/domain'
            path-prefix: packages/domain
            flag: domain
          - display: Collection JSON
            filter: '@genshin/collection-json'
            path-prefix: packages/collection-json
            flag: collection-json
          - display: Validation
            filter: '@genshin/validation'
            path-prefix: packages/validation
            flag: validation
          - display: Game Data Codegen
            filter: '@genshin/game-data-codegen'
            path-prefix: tools/game-data-codegen
            flag: game-data-codegen

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/node-ci
        with:
          filter: ${{ matrix.filter }}
          coverage-file: ${{ matrix.path-prefix }}/coverage/lcov.info
          results-file: ${{ matrix.path-prefix }}/test-results/junit.xml
          flag: ${{ matrix.flag }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

      - name: Verify Build Artifacts
        if: matrix.flag == 'web'
        run: bash apps/web/scripts/verify-build-output.sh

  # Proves the PR's persisted-data schemas stay backward-compatible with the ones
  # on its base branch — Firestore documents (apps/api) and localStorage snapshots
  # written by zustand `persist` (apps/web). A branch-vs-base invariant, so it's
  # its own PR-only job with the base ref in hand — not a step in the per-package
  # matrix above. It diffs committed JSON snapshots, so it needs the install but
  # no workspace build.
  schema-compat:
    name: Check schema compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 \
            origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - uses: ./.github/actions/setup-node-pnpm

      - name: Check schema compatibility
        env:
          SCHEMA_COMPAT_BASE: origin/${{ github.base_ref }}
        run: pnpm --filter @genshin/api schemas:check

  # Runs every hook. This is the only runner, so a hook added to
  # .pre-commit-config.yaml is enforced here without touching this file.
  pre-commit:
    name: Run hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      TERRAFORM_VERSION: '1.15.8'
      # renovate: datasource=github-releases depName=hadolint/hadolint
      HADOLINT_VERSION: 'v2.14.0'
      # renovate: datasource=github-releases depName=lycheeverse/lychee extractVersion=^lychee-v(?<version>.+)$
      LYCHEE_VERSION: '0.24.2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_INSTALL=https://raw.githubusercontent.com/aquasecurity/trivy
          curl -fsSL "$TRIVY_INSTALL/main/contrib/install.sh" \
            | sh -s -- -b /usr/local/bin

      - name: Install hadolint
        run: |
          set -euo pipefail
          sudo curl -fsSL \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o /usr/local/bin/hadolint
          sudo chmod +x /usr/local/bin/hadolint

      # musl, so the binary is static and carries no glibc floor.
      - name: Install lychee
        run: |
          set -euo pipefail
          LYCHEE_URL=https://github.com/lycheeverse/lychee/releases/download
          LYCHEE_DIR=lychee-x86_64-unknown-linux-musl
          curl -fsSL \
            "${LYCHEE_URL}/lychee-v${LYCHEE_VERSION}/${LYCHEE_DIR}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "${LYCHEE_DIR}/lychee"

      - name: Run hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          TRIVY_CONFIG: ${{ github.workspace }}/.trivy.yaml
          # no-commit-to-branch guards local commits against develop and main,
          # and a push-event checkout is attached to the very branch it guards,
          # so it would fail every merge.
          SKIP: no-commit-to-branch
        with:
          extra_args: --all-files

  # Verified-mode secret scanning: TruffleHog confirms a detected credential is
  # live before failing, so this gate is high-signal and needs no allowlist.
  # It complements GitHub's free push protection (known-provider patterns,
  # server-side) with broad, verified detection that GitHub only offers under
  # the paid Secret Protection product. fetch-depth: 0 gives TruffleHog the full
  # commit range so it scans only the diff, not a snapshot.
  secrets:
    name: Scan for verified secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified

  # Online supply-chain audits (impostor commits, known-vulnerable actions)
  # need a token and network. This job uploads SARIF to the Security tab and
  # blocks on findings; the offline audits are gated by the zizmor pre-commit
  # hook, which the pre-commit job above runs.
  workflows:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          config: .github/zizmor.yml

  trivy-terraform:
    name: Scan Terraform config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Terraform
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          format: sarif
          output: terraform-results.sarif
          trivy-config: .trivy.yaml

      - name: Upload Terraform SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always()
        with:
          sarif_file: terraform-results.sarif
          category: trivy-terraform

  trivy-dockerfile:
    name: Scan Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Dockerfile
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          scan-type: config
          scan-ref: apps/api
          format: sarif
          output: dockerfile-results.sarif
          trivy-config: .trivy.yaml

      - name: Upload Dockerfile SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always()
        with:
          sarif_file: dockerfile-results.sarif
          category: trivy-dockerfile

  # One build feeds both the scan and the smoke test. As two jobs they built
  # the same image twice and raced each other writing the same type=gha cache
  # scope. The scan runs first because it never fails the job (trivy-action
  # defaults to exit-code 0, reporting through SARIF), so a smoke failure can
  # still not cost us the scan results.
  container:
    name: Scan and smoke-test container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          load: true
          tags: api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Container Image
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          image-ref: api:ci
          format: sarif
          output: container-results.sarif
          trivy-config: .trivy.yaml

      - name: Upload Container SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always()
        with:
          sarif_file: container-results.sarif
          category: trivy-container

      - name: Smoke-test container startup
        env:
          IMAGE_TAG: api:ci
        run: bash apps/api/scripts/smoke-test-container.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker logs api-smoke 2>&1 || true

      - name: Cleanup container
        if: always()
        run: docker rm -f api-smoke 2>/dev/null || true

# ---------------------------------------------------------------------------
# Maintenance notes
# - Add a new matrix entry under strategy.matrix.include when new apps or
#   packages are added.
# - Keep caching strategy aligned with package manager changes.
# ---------------------------------------------------------------------------
