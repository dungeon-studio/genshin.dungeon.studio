---
name: CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  test:
    name: ${{ matrix.display }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - display: Web
            filter: '@genshin/web'
            path-prefix: apps/web
            flag: web
          - display: API
            filter: '@genshin/api'
            path-prefix: apps/api
            flag: api
          - display: Game Data
            filter: '@genshin/game-data'
            path-prefix: packages/game-data
            flag: game-data
          - display: Domain
            filter: '@genshin/domain'
            path-prefix: packages/domain
            flag: domain
          - display: Collection JSON
            filter: '@genshin/collection-json'
            path-prefix: packages/collection-json
            flag: collection-json
          - display: Validation
            filter: '@genshin/validation'
            path-prefix: packages/validation
            flag: validation
          - display: Game Data Codegen
            filter: '@genshin/game-data-codegen'
            path-prefix: tools/game-data-codegen
            flag: game-data-codegen

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/node-ci
        with:
          filter: ${{ matrix.filter }}
          coverage-file: ${{ matrix.path-prefix }}/coverage/lcov.info
          results-file: ${{ matrix.path-prefix }}/test-results/junit.xml
          flag: ${{ matrix.flag }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

      - name: Verify Build Artifacts
        if: matrix.flag == 'web'
        run: bash apps/web/scripts/verify-build-output.sh

  # Proves the PR's persisted-data schemas stay backward-compatible with the ones
  # on its base branch — Firestore documents (apps/api) and localStorage snapshots
  # written by zustand `persist` (apps/web). A branch-vs-base invariant, so it's
  # its own PR-only job with the base ref in hand — not a step in the per-package
  # matrix above. It diffs committed JSON snapshots, so it needs the install but
  # no workspace build.
  schema-compat:
    name: Schema Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 \
            origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - uses: ./.github/actions/setup-node-pnpm

      - name: Check schema compatibility
        env:
          SCHEMA_COMPAT_BASE: origin/${{ github.base_ref }}
        run: pnpm --filter @genshin/api schemas:check

  # Drives a real browser through the assembled stack — Firebase emulators, the
  # API, and the Vite dev server — so it needs a Java runtime and a browser the
  # per-package matrix above has no reason to install. Its own job for the same
  # reason schema-compat is: setup the node-ci composite action does not provide.
  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      # The Firestore emulator is a Java process. Pinning it here keeps the job
      # off whatever JDK happens to be baked into the runner image.
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      # Browser builds are keyed by Playwright version, so the cache only misses
      # when the dependency itself moves. Read straight from the manifest, which
      # syncpack keeps pinned to an exact version: `pnpm exec` writes warnings to
      # the same stream as the version it reports, and those would land in
      # GITHUB_OUTPUT too.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test']")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @genshin/web exec playwright install --with-deps chromium

      # The cached browser still needs its shared libraries on a fresh runner.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @genshin/web exec playwright install-deps chromium

      - name: Run end-to-end tests
        run: pnpm turbo run test:e2e --filter=@genshin/web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: /tmp/genshin-e2e
          retention-days: 7

# ---------------------------------------------------------------------------
# Maintenance notes
# - Add a new matrix entry under strategy.matrix.include when new apps or
#   packages are added.
# - Keep caching strategy aligned with package manager changes.
# ---------------------------------------------------------------------------
