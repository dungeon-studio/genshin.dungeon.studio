---
name: CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  test:
    name: ${{ matrix.display }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - display: Web
            filter: '@genshin/web'
            path-prefix: apps/web
            flag: web
          - display: API
            filter: '@genshin/api'
            path-prefix: apps/api
            flag: api
          - display: Game Data
            filter: '@genshin/game-data'
            path-prefix: packages/game-data
            flag: game-data
          - display: Domain
            filter: '@genshin/domain'
            path-prefix: packages/domain
            flag: domain
          - display: Collection JSON
            filter: '@genshin/collection-json'
            path-prefix: packages/collection-json
            flag: collection-json
          - display: Validation
            filter: '@genshin/validation'
            path-prefix: packages/validation
            flag: validation
          - display: Game Data Codegen
            filter: '@genshin/game-data-codegen'
            path-prefix: tools/game-data-codegen
            flag: game-data-codegen

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/node-ci
        with:
          filter: ${{ matrix.filter }}
          coverage-file: ${{ matrix.path-prefix }}/coverage/lcov.info
          results-file: ${{ matrix.path-prefix }}/test-results/junit.xml
          flag: ${{ matrix.flag }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

      - name: Verify Build Artifacts
        if: matrix.flag == 'web'
        run: bash apps/web/scripts/verify-build-output.sh

  # Proves the PR's persisted-data schemas stay backward-compatible with the ones
  # on its base branch — Firestore documents (apps/api) and localStorage snapshots
  # written by zustand `persist` (apps/web). A branch-vs-base invariant, so it's
  # its own PR-only job with the base ref in hand — not a step in the per-package
  # matrix above. It diffs committed JSON snapshots, so it needs the install but
  # no workspace build.
  schema-compat:
    name: Schema Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 \
            origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - uses: ./.github/actions/setup-node-pnpm

      - name: Check schema compatibility
        env:
          SCHEMA_COMPAT_BASE: origin/${{ github.base_ref }}
        run: pnpm --filter @genshin/api schemas:check

  # Smoke-tests the local dev stack: `pnpm dev` must bring up the web server,
  # API server, and Firebase emulators. Guards against a regression (missing
  # dependency, broken import, port conflict) silently breaking `pnpm dev`.
  # Separate from the per-package matrix because it exercises the whole stack
  # end-to-end rather than one workspace.
  dev-smoke:
    name: Dev Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      # The Firebase emulators run on the JVM.
      - name: Set up Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'

      # `pnpm dev` resolves `@genshin/*` to each package's `dist/`, and the
      # `dev` turbo task has no `^build`, so the libraries must be built first.
      - name: Build workspace libraries
        run: pnpm turbo run build --filter='./packages/*'

      - name: Verify dev stack starts
        run: bash scripts/verify-dev.sh

# ---------------------------------------------------------------------------
# Maintenance notes
# - Add a new matrix entry under strategy.matrix.include when new apps or
#   packages are added.
# - Keep caching strategy aligned with package manager changes.
# ---------------------------------------------------------------------------
