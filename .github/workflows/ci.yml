---
name: CI

# Every sensor that runs unconditionally on an integration event.
# See docs/reference/workflow-conventions.md.
on:
  pull_request:
  merge_group:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs; never cancel a push to a long-lived
  # branch, so every commit on it keeps a result of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Unfiltered, so turbo orders the workspace from turbo.json and builds each
  # package once. Splitting this per package costs that.
  workspace:
    name: Build and test workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      # Persist turbo's local cache so unchanged packages skip rebuilds across
      # runs. GitHub cache entries are write-once per key, so a stable key would
      # freeze after the first save; the per-commit key saves a fresh entry each
      # run while the prefix restore-key restores the most recent one.
      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # --continue reports every package rather than stopping at the first
      # failure.
      - name: Typecheck
        run: pnpm turbo run typecheck --continue

      # Seed property-based tests from the commit under test: a re-run of the same
      # commit replays identical inputs (so a failure reproduces), while a new
      # commit or PR draws fresh inputs (so the generators keep exploring).
      # Eight digits, not more: bash wraps a longer slice modulo 2^64. The
      # integer check in apps/api/src/test/setup.ts accepts the negative result,
      # so a wider slice fails silently.
      - name: Derive fast-check seed
        id: fast-check
        env:
          SEED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "seed=$((16#${SEED_SOURCE:0:8}))" >> "$GITHUB_OUTPUT"

      - name: Test
        env:
          FAST_CHECK_SEED: ${{ steps.fast-check.outputs.seed }}
        run: pnpm turbo run test --continue -- --coverage

      # apps/web fails the build when its Firebase config is missing, so that a
      # deployed bundle can never fall back to the local-emulator placeholders in
      # lib/firebase.ts. This build only proves the app compiles and its output is
      # discarded, so any non-empty value satisfies it. Deployed bundles come from
      # the separate build step in deploy.yml, which injects the real config.
      # apps/web's Codecov bundle report uploads from inside `vite build`, so the
      # token is consumed here rather than by the upload step below.
      #
      # A package's `verify` task checks its own build output. Turbo passes over
      # a package that defines none, so this job needs no package-specific step.
      # `verify` shares one invocation with `build` because the VITE_* values are
      # part of the build task's hash: a separate step without them misses the
      # cache and rebuilds without the config this step supplies.
      - name: Build and verify
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          VITE_API_BASE_URL: https://api.invalid
          VITE_SITE_ORIGIN: https://ci.invalid
          VITE_FIREBASE_API_KEY: ci
          VITE_FIREBASE_AUTH_DOMAIN: ci.invalid
          VITE_FIREBASE_PROJECT_ID: ci
          VITE_FIREBASE_STORAGE_BUCKET: ci.invalid
          VITE_FIREBASE_MESSAGING_SENDER_ID: ci
          VITE_FIREBASE_APP_ID: ci
        run: pnpm turbo run build verify --continue

      - name: Upload coverage and test results to Codecov
        if: ${{ !cancelled() }}
        uses: ./.github/actions/codecov-upload-workspace
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # Proves the PR's persisted-data schemas stay backward-compatible with the ones
  # on its base branch — Firestore documents (apps/api) and localStorage snapshots
  # written by zustand `persist` (apps/web). A branch-vs-base invariant, so it's
  # its own PR-only job with the base ref in hand rather than a `verify` task in
  # the job above. It diffs committed JSON snapshots, so it needs the install but
  # no workspace build.
  schema-compat:
    name: Check schema compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 \
            origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - uses: ./.github/actions/setup-node-pnpm

      - name: Check schema compatibility
        env:
          SCHEMA_COMPAT_BASE: origin/${{ github.base_ref }}
        run: pnpm --filter @genshin/schema-snapshots schemas:check

  # Smoke-tests the root `pnpm dev` script — the one command a contributor runs
  # to bring up the whole stack (web, API, Firebase emulators). The e2e job below
  # hits the same services but through playwright.config.ts's own orchestration;
  # only this job exercises the root script and the turbo `dev` graph.
  dev-smoke:
    name: Smoke-test dev stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # renovate: datasource=java-version depName=java
      JAVA_VERSION: '25.0.4+101.0.LTS'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-firebase-emulators
        with:
          java-version: ${{ env.JAVA_VERSION }}

      # The stack starts behind `firebase emulators:exec`, so the first
      # readiness check absorbs emulator startup — and the emulator download on
      # a cache miss. Matches the per-server budget in playwright.config.ts.
      - name: Verify dev stack starts
        env:
          TIMEOUT_SECONDS: '120'
        run: bash scripts/verify-dev.sh

  # Exercises the repository layer against a real Firestore. The workspace job
  # above mocks it away and the browser suite below reaches it only along the
  # paths the UI offers, so neither can plant a stored document the API is
  # incapable of writing.
  integration:
    name: Test against Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # renovate: datasource=java-version depName=java
      JAVA_VERSION: '25.0.4+101.0.LTS'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-firebase-emulators
        with:
          java-version: ${{ env.JAVA_VERSION }}

      # Coverage lives in the script rather than a `--` passthrough, which would
      # reach `firebase emulators:exec` instead of the vitest run inside it.
      - name: Run integration tests
        run: pnpm turbo run test:integration --filter @genshin/api

      # Under the same flag as the unit suite, whose paths already cover
      # apps/api/src/**; Codecov merges the two reports.
      - name: Upload integration coverage to Codecov
        if: ${{ !cancelled() }}
        uses: ./.github/actions/codecov-upload
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/coverage-integration/lcov.info
          flag: api

      - name: Upload integration test results to Codecov
        if: ${{ !cancelled() }}
        uses: ./.github/actions/codecov-upload
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/api/test-results/integration-junit.xml
          flag: api
          report_type: test_results

  # Drives a real browser through the assembled stack — Firebase emulators, the
  # API, and the Vite dev server. Separate from the workspace job because it is
  # the only check needing a JDK and a browser, and turbo cannot schedule either.
  e2e:
    name: Run end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # renovate: datasource=java-version depName=java
      JAVA_VERSION: '25.0.4+101.0.LTS'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-firebase-emulators
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - uses: ./.github/actions/setup-playwright

      - name: Run end-to-end tests
        run: pnpm turbo run test:e2e --filter=@genshin/e2e

      # Its own flag, so a flaky browser test is not attributed to the vitest
      # suite behind `web`. A failing run is the one test analytics needs, hence
      # the condition.
      - name: Upload end-to-end test results to Codecov
        if: ${{ !cancelled() }}
        uses: ./.github/actions/codecov-upload
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          files: tools/e2e/test-results/e2e-junit.xml
          flag: e2e
          report_type: test_results

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: /tmp/genshin-e2e
          retention-days: 7

  # The only runner, so a hook added to .pre-commit-config.yaml is enforced
  # without touching this file.
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      TERRAFORM_VERSION: '1.16.6'
      # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.+)$
      TRIVY_VERSION: '0.76.1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      # Hooks call the tools below from PATH.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_URL=https://github.com/aquasecurity/trivy/releases/download
          curl -fsSL \
            "${TRIVY_URL}/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy

      - name: Install lychee
        run: scripts/install-lychee.sh

      - name: Run hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          TRIVY_CONFIG: ${{ github.workspace }}/.trivy.yaml
          # no-commit-to-branch guards local commits against develop and main,
          # and a push-event checkout is attached to the very branch it guards,
          # so it would fail every merge.
          SKIP: no-commit-to-branch
        with:
          extra_args: --all-files

  # Verified-mode secret scanning: TruffleHog confirms a detected credential is
  # live before failing, so this gate is high-signal and needs no allowlist.
  # It complements GitHub's free push protection (known-provider patterns,
  # server-side) with broad, verified detection that GitHub only offers under
  # the paid Secret Protection product. fetch-depth: 0 gives TruffleHog the full
  # commit range so it scans only the diff, not a snapshot.
  secrets:
    name: Scan for verified secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action derives a scan range only for push and pull_request, and
      # scans the full history on any other event.
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@e63326d6545de8f425d93ce24078c6e68d83f70e # v3.99.3
        with:
          base: ${{ github.event.merge_group.base_sha }}
          head: ${{ github.event.merge_group.head_sha }}
          extra_args: --results=verified

  # Online supply-chain audits (impostor commits, known-vulnerable actions)
  # need a token and network. This job uploads SARIF to the Security tab and
  # blocks on findings; the offline audits are gated by the zizmor pre-commit
  # hook, which the pre-commit job above runs.
  workflow-audit:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          config: .github/zizmor.yml

  # Trivy applies a tfvars file to every root module under the scan path, so
  # each root scans alone with its own.
  trivy-terraform:
    name: Scan ${{ matrix.root }} Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - root: bootstrap
            path: infrastructure/terraform/bootstrap
          - root: core
            path: infrastructure/terraform/environments/core
            tf-vars: infrastructure/terraform/environments/core/terraform.tfvars
          - root: dev
            path: infrastructure/terraform/environments/dev
            tf-vars: infrastructure/terraform/environments/dev/terraform.tfvars
          - root: staging
            path: infrastructure/terraform/environments/staging
            tf-vars: infrastructure/terraform/environments/staging/terraform.tfvars
          - root: prod
            path: infrastructure/terraform/environments/prod
            tf-vars: infrastructure/terraform/environments/prod/terraform.tfvars

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Terraform
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          scan-type: config
          scan-ref: ${{ matrix.path }}
          tf-vars: ${{ matrix.tf-vars }}
          format: sarif
          output: terraform-results.sarif
          trivy-config: .trivy.yaml

      - name: Upload Terraform SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: terraform-results.sarif
          category: trivy-terraform-${{ matrix.root }}

  # The matrix reports one context per root, so a ruleset requires this job
  # instead and a new root never touches the ruleset.
  trivy-terraform-result:
    name: Scan Terraform
    needs: trivy-terraform
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fail unless every scan succeeded
        if: needs.trivy-terraform.result != 'success'
        run: exit 1

  # A job decides whether to plan, rather than a `paths:` gate, so
  # `Plan infrastructure` reports on every pull request and a ruleset can
  # require it.
  terraform-changes:
    name: Detect Terraform changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Reaches the base: the first parent of the pull request's merge commit.
          fetch-depth: 2

      # bootstrap/ is applied by hand, and no plan below targets prod. `git diff`
      # exits nonzero on error too, so a failed diff runs the plans.
      - name: Diff against the base
        id: diff
        run: |
          if git diff --quiet HEAD^1 HEAD -- \
            infrastructure/terraform \
            ':!infrastructure/terraform/bootstrap' \
            ':!infrastructure/terraform/environments/prod' \
            .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # A skipped job never expands its matrix, so a matrix reference in the
  # name would show raw. GitHub appends the environment to each run's name.
  terraform-plan:
    name: Plan environment infrastructure
    needs: terraform-changes
    if: needs.terraform-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    env:
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      TERRAFORM_VERSION: '1.16.6'

    strategy:
      fail-fast: false
      matrix:
        environment: [core, dev, staging]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # Each environment maps to an explicit secret, because CodeQL flags
      # dynamic secret indexing as actions/excessive-secrets-exposure.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_RO_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: >-
            ${{
              matrix.environment == 'core' && secrets.GCP_RO_CORE_SERVICE_ACCOUNT_EMAIL ||
              matrix.environment == 'dev' && secrets.GCP_RO_DEV_SERVICE_ACCOUNT_EMAIL ||
              matrix.environment == 'staging' && secrets.GCP_RO_STAGING_SERVICE_ACCOUNT_EMAIL
            }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: terraform init

      - name: Terraform Plan
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: |
          terraform plan -lock=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment PR with Plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const workspaceRoot = process.env.GITHUB_WORKSPACE;
            const environment = '${{ matrix.environment }}';
            const planPath = `${workspaceRoot}/infrastructure/terraform/environments/${environment}/plan.txt`;
            const plan = fs.readFileSync(planPath, 'utf8');

            const summaryMatch = plan.match(/^(No changes\..+|Plan: .+)$/m);
            const summary = summaryMatch ? summaryMatch[0] : 'Plan generated';

            const marker = `<!-- terraform-plan:${environment} -->`;
            const body = [
              marker,
              `## terraform-plan (${environment})`,
              '',
              `**${summary}**`,
              '',
              '<details>',
              '<summary>Show full plan output</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>'
            ].join('\n');

            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...issue, per_page: 100 });

            const existing = comments.find(comment => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              return;
            }

            await github.rest.issues.createComment({ ...issue, body });

  # The matrix reports one context per environment and none when it skips, so a
  # ruleset requires this job instead. It needs change detection too, so a
  # detection failure can't pass as a skipped plan.
  terraform-plan-result:
    name: Plan infrastructure
    needs: [terraform-changes, terraform-plan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fail on a failed or cancelled plan
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  trivy-dockerfile:
    name: Scan Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Dockerfile
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          scan-type: config
          scan-ref: apps/api
          format: sarif
          output: dockerfile-results.sarif
          trivy-config: .trivy.yaml

      - name: Upload Dockerfile SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: dockerfile-results.sarif
          category: trivy-dockerfile

  trivy-dependencies:
    name: Scan dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The lockfile resolves every workspace; scanning the directory would
      # also walk build output and fixtures.
      - name: Scan dependency vulnerabilities
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          scan-type: fs
          scan-ref: pnpm-lock.yaml
          scanners: vuln
          exit-code: '1'
          trivy-config: .trivy.yaml

      - uses: ./.github/actions/setup-node-pnpm

      # Licences come from node_modules, which Trivy reads only on a directory
      # scan. Failing on UNKNOWN forces a decision on any licence Trivy can't
      # classify.
      - name: Scan dependency licences
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          severity: UNKNOWN,HIGH,CRITICAL
          exit-code: '1'
          trivy-config: .trivy.yaml

  # The scan runs before the smoke test so a smoke-test failure cannot skip
  # the upload.
  container:
    name: Scan and smoke-test container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # deploy.yml tags its image with this action after merge, so a breaking
      # release has to fail here first.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: api
          tags: type=raw,value=ci

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Base-image fixes arrive on the upstream digest's schedule, so findings
      # report without blocking. A finding with no upgrade path leaves nothing
      # to act on. trivy-action drops a severity input for SARIF unless
      # limit-severities-for-sarif is set.
      - name: Scan Container Image
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          image-ref: api:ci
          scanners: vuln
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: container-results.sarif
          trivy-config: .trivy.yaml

      - name: Upload Container SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: container-results.sarif
          category: trivy-container

      - name: Smoke-test container startup
        env:
          IMAGE_TAG: api:ci
        run: bash apps/api/scripts/smoke-test-container.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker logs api-smoke 2>&1 || true

      - name: Cleanup container
        if: always()
        run: docker rm -f api-smoke 2>/dev/null || true

  # A step skips the expensive devcontainer build unless an input changed, so
  # the check still reports on every pull request and a ruleset can require
  # it. Inputs another job already exercises stay off the list.
  toolchain:
    name: Verify toolchain
    runs-on: ubuntu-latest
    # Headroom for a cold build.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Reaches the base: the first parent of the merge or squash commit.
          fetch-depth: 2

      # `git diff` exits nonzero on error too, so a failed diff builds.
      - name: Diff against the base
        id: diff
        run: |
          inputs=(
            .devcontainer
            scripts/install-reuse.sh
            scripts/install-lychee.sh
            # packageManager, engines, and the firebase-tools pin.
            package.json
            # The Playwright pin the browsers install from.
            tools/e2e/package.json
            .github/workflows/ci.yml
          )
          if git diff --quiet HEAD^1 HEAD -- "${inputs[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the image and verify its toolchain
        if: steps.diff.outputs.changed == 'true'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: genshin-planner-devcontainer
          push: never
          # The action starts the container only when runCmd is set. Starting
          # it runs postCreateCommand.sh, which verifies the toolchain.
          # Project-wide checks belong in .pre-commit-config.yaml.
          runCmd: 'true'

  # release-notes.yml drafts only after merge, so a breaking release-drafter
  # has to fail here first.
  release-draft:
    name: Preview release draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Preview release draft
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          dry-run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # daily.yml prunes only on a schedule, so a breaking actions/stale has to
  # fail here first.
  stale-pull-requests:
    name: Preview stale pull request pruning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preview stale pull request pruning
        uses: ./.github/actions/prune-stale-pull-requests
        with:
          debug-only: 'true'
