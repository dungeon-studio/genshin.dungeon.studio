---
name: CI

# Every sensor that runs unconditionally on an integration event.
# See docs/reference/workflow-conventions.md.
on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs; never cancel a push to a long-lived
  # branch, so every commit on it keeps a result of its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Unfiltered, so turbo orders the workspace from turbo.json and builds each
  # package once. Splitting this per package costs that.
  workspace:
    name: Build and test workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      # Persist turbo's local cache so unchanged packages skip rebuilds across
      # runs. GitHub cache entries are write-once per key, so a stable key would
      # freeze after the first save; the per-commit key saves a fresh entry each
      # run while the prefix restore-key restores the most recent one.
      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Seed property-based tests from the commit under test: a re-run of the same
      # commit replays identical inputs (so a failure reproduces), while a new
      # commit or PR draws fresh inputs (so the generators keep exploring). The
      # first 8 hex digits of the SHA become a 32-bit integer seed.
      - name: Derive fast-check seed
        env:
          SEED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        # SEED_SOURCE is a commit SHA (trusted, hex), not attacker-controlled;
        # low-confidence finding tracked for recheck in #910.
        run: echo "FAST_CHECK_SEED=$((16#${SEED_SOURCE:0:8}))" >> "$GITHUB_ENV" # zizmor: ignore[github-env]

      # --continue reports every package rather than stopping at the first
      # failure.
      - name: Typecheck
        run: pnpm turbo run typecheck --continue

      - name: Test
        run: pnpm turbo run test --continue -- --coverage

      # apps/web fails the build when its Firebase config is missing, so that a
      # deployed bundle can never fall back to the local-emulator placeholders in
      # lib/firebase.ts. This build only proves the app compiles and its output is
      # discarded, so any non-empty value satisfies it. Deployed bundles come from
      # the separate build step in deploy.yml, which injects the real config.
      - name: Build
        env:
          VITE_API_BASE_URL: https://api.invalid
          VITE_FIREBASE_API_KEY: ci
          VITE_FIREBASE_AUTH_DOMAIN: ci.invalid
          VITE_FIREBASE_PROJECT_ID: ci
          VITE_FIREBASE_STORAGE_BUCKET: ci.invalid
          VITE_FIREBASE_MESSAGING_SENDER_ID: ci
          VITE_FIREBASE_APP_ID: ci
        run: pnpm turbo run build --continue

      - name: Verify Build Artifacts
        run: bash apps/web/scripts/verify-build-output.sh

      - name: Upload coverage and test results to Codecov
        if: ${{ !cancelled() }}
        uses: ./.github/actions/codecov-upload
        with:
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # Proves the PR's persisted-data schemas stay backward-compatible with the ones
  # on its base branch — Firestore documents (apps/api) and localStorage snapshots
  # written by zustand `persist` (apps/web). A branch-vs-base invariant, so it's
  # its own PR-only job with the base ref in hand — not a step in the per-package
  # matrix above. It diffs committed JSON snapshots, so it needs the install but
  # no workspace build.
  schema-compat:
    name: Check schema compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 \
            origin "$BASE_REF:refs/remotes/origin/$BASE_REF"

      - uses: ./.github/actions/setup-node-pnpm

      - name: Check schema compatibility
        env:
          SCHEMA_COMPAT_BASE: origin/${{ github.base_ref }}
        run: pnpm --filter @genshin/api schemas:check

  # Smoke-tests the root `pnpm dev` script — the one command a contributor runs
  # to bring up the whole stack (web, API, Firebase emulators). The e2e job below
  # hits the same services but through playwright.config.ts's own orchestration;
  # only this job exercises the root script and the turbo `dev` graph.
  dev-smoke:
    name: Smoke-test dev stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # renovate: datasource=java-version depName=java
      JAVA_VERSION: '21'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-firebase-emulators
        with:
          java-version: ${{ env.JAVA_VERSION }}

      # The stack starts behind `firebase emulators:exec`, so the first
      # readiness check absorbs emulator startup — and the emulator download on
      # a cache miss. Matches the per-server budget in playwright.config.ts.
      - name: Verify dev stack starts
        env:
          TIMEOUT_SECONDS: '120'
        run: bash scripts/verify-dev.sh

  # Drives a real browser through the assembled stack — Firebase emulators, the
  # API, and the Vite dev server. Separate from the workspace job because it is
  # the only check needing a JDK and a browser, and turbo cannot schedule either.
  e2e:
    name: Run end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # renovate: datasource=java-version depName=java
      JAVA_VERSION: '21'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-firebase-emulators
        with:
          java-version: ${{ env.JAVA_VERSION }}

      # From the manifest, which syncpack keeps pinned exact: `pnpm exec` writes
      # warnings to the same stream as the version it reports, and both would
      # land in GITHUB_OUTPUT.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(node -p "require('./tools/e2e/package.json').devDependencies['@playwright/test']")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Keyed by Playwright version, so the cache misses only when the
      # dependency moves.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @genshin/e2e exec playwright install --with-deps chromium

      # The cached browser still needs its shared libraries on a fresh runner.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @genshin/e2e exec playwright install-deps chromium

      - name: Run end-to-end tests
        run: pnpm turbo run test:e2e --filter=@genshin/e2e

      # Its own flag, so a flaky browser test is not attributed to the vitest
      # suite behind `web`. A failing run is the one test analytics needs, hence
      # the condition.
      - name: Upload end-to-end test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tools/e2e/test-results/e2e-junit.xml
          flags: e2e
          report_type: test_results
          fail_ci_if_error: false

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: /tmp/genshin-e2e
          retention-days: 7

  # The only runner, so a hook added to .pre-commit-config.yaml is enforced
  # without touching this file.
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # renovate: datasource=github-releases depName=hashicorp/terraform extractVersion=^v(?<version>.+)$
      TERRAFORM_VERSION: '1.15.8'
      # renovate: datasource=github-releases depName=hadolint/hadolint
      HADOLINT_VERSION: 'v2.14.0'
      # renovate: datasource=github-releases depName=lycheeverse/lychee extractVersion=^lychee-v(?<version>.+)$
      LYCHEE_VERSION: '0.24.2'
      # renovate: datasource=github-releases depName=aquasecurity/trivy extractVersion=^v(?<version>.+)$
      TRIVY_VERSION: '0.72.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_URL=https://github.com/aquasecurity/trivy/releases/download
          curl -fsSL \
            "${TRIVY_URL}/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy

      - name: Install hadolint
        run: |
          set -euo pipefail
          sudo curl -fsSL \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o /usr/local/bin/hadolint
          sudo chmod +x /usr/local/bin/hadolint

      # musl, so the binary is static and carries no glibc floor.
      - name: Install lychee
        run: |
          set -euo pipefail
          LYCHEE_URL=https://github.com/lycheeverse/lychee/releases/download
          LYCHEE_DIR=lychee-x86_64-unknown-linux-musl
          curl -fsSL \
            "${LYCHEE_URL}/lychee-v${LYCHEE_VERSION}/${LYCHEE_DIR}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "${LYCHEE_DIR}/lychee"

      - name: Run hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          TRIVY_CONFIG: ${{ github.workspace }}/.trivy.yaml
          # no-commit-to-branch guards local commits against develop and main,
          # and a push-event checkout is attached to the very branch it guards,
          # so it would fail every merge.
          SKIP: no-commit-to-branch
        with:
          extra_args: --all-files

  # Verified-mode secret scanning: TruffleHog confirms a detected credential is
  # live before failing, so this gate is high-signal and needs no allowlist.
  # It complements GitHub's free push protection (known-provider patterns,
  # server-side) with broad, verified detection that GitHub only offers under
  # the paid Secret Protection product. fetch-depth: 0 gives TruffleHog the full
  # commit range so it scans only the diff, not a snapshot.
  secrets:
    name: Scan for verified secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified

  # Online supply-chain audits (impostor commits, known-vulnerable actions)
  # need a token and network. This job uploads SARIF to the Security tab and
  # blocks on findings; the offline audits are gated by the zizmor pre-commit
  # hook, which the pre-commit job above runs.
  workflow-audit:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          config: .github/zizmor.yml

  trivy-terraform:
    name: Scan Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Terraform
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          format: sarif
          output: terraform-results.sarif
          trivy-config: .trivy.yaml

      - name: Upload Terraform SARIF
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: always()
        with:
          sarif_file: terraform-results.sarif
          category: trivy-terraform

  trivy-dockerfile:
    name: Scan Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan Dockerfile
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          scan-type: config
          scan-ref: apps/api
          format: sarif
          output: dockerfile-results.sarif
          trivy-config: .trivy.yaml

      - name: Upload Dockerfile SARIF
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: always()
        with:
          sarif_file: dockerfile-results.sarif
          category: trivy-dockerfile

  # One build feeds both the scan and the smoke test. The scan goes first
  # because trivy-action defaults to exit-code 0 and reports through SARIF, so
  # a smoke-test failure cannot cost us its results.
  container:
    name: Scan and smoke-test container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          load: true
          tags: api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Container Image
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          image-ref: api:ci
          format: sarif
          output: container-results.sarif
          trivy-config: .trivy.yaml

      - name: Upload Container SARIF
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        if: always()
        with:
          sarif_file: container-results.sarif
          category: trivy-container

      - name: Smoke-test container startup
        env:
          IMAGE_TAG: api:ci
        run: bash apps/api/scripts/smoke-test-container.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker logs api-smoke 2>&1 || true

      - name: Cleanup container
        if: always()
        run: docker rm -f api-smoke 2>/dev/null || true
