---
name: Labels

# release-notes.yml groups the draft by the labels this applies; both read
# their rules from .github/release-drafter.yml.

# Every run finishes; see docs/reference/workflow-conventions.md#required-checks.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  # Labels same-repo pull requests only; fork pull requests run with a
  # read-only token. Switch the trigger to pull_request_target to label fork
  # pull requests (see the release-drafter README) once outside contributions
  # arrive.
  autolabel:
    name: Label pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - uses: release-drafter/release-drafter/autolabeler@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
