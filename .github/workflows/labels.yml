---
name: Labels

# release-notes.yml groups the draft by the labels this applies; both read
# their rules from .github/release-drafter.yml.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# No concurrency group: `synchronize` and `edited` fire seconds apart on one
# head commit, and a cancelled run left beside the successful one holds the
# pull request at `blocked`, auto-merge included.

jobs:
  # Labels same-repo pull requests only; fork pull requests run with a
  # read-only token. Switch the trigger to pull_request_target to label fork
  # pull requests (see the release-drafter README) once outside contributions
  # arrive.
  autolabel:
    name: Label pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
