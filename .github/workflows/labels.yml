---
name: Labels

# release-notes.yml groups the draft by the labels this applies; both read
# their rules from .github/release-drafter.yml.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Labels same-repo pull requests only; fork pull requests run with a
  # read-only token. Switch the trigger to pull_request_target to label fork
  # pull requests (see the release-drafter README) once outside contributions
  # arrive.
  autolabel:
    name: Label pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
