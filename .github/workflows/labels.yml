---
name: Labels

# The labels this applies are what release-notes.yml groups the draft by, and
# both read their rules from .github/release-drafter.yml. They stay separate
# workflows because they run on different triggers.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Labels same-repo pull requests only; fork pull requests run with a
  # read-only token. Switch the trigger to pull_request_target to label fork
  # pull requests (see the release-drafter README) once outside contributions
  # arrive.
  autolabel:
    name: Label pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - uses: release-drafter/release-drafter/autolabeler@eada3c96a64734dd381cfbda23511034e328ddb0 # v7.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
