---
name: Release Notes

# Groups the draft by the labels labels.yml applies; both read their rules from
# .github/release-drafter.yml.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Notes are collected from pull requests merged into develop (commitish in the
  # config). At release time, publish the running draft and set its tag target
  # to the main merge commit so the tag lands on main per git flow.
  draft:
    name: Update release draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
