---
name: Docker

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          load: true
          tags: api-smoke:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test container startup
        run: bash apps/api/scripts/smoke-test-container.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker logs api-smoke 2>&1 || true

      - name: Cleanup container
        if: always()
        run: docker rm -f api-smoke 2>/dev/null || true
# ---------------------------------------------------------------------------
# Maintenance notes
# ---------------------------------------------------------------------------
# This workflow validates that the API Docker image builds and starts
# correctly on pull requests. It does not push to any registry.
#
# Read-only permissions prevent any potential security issues from PR code
# accessing write tokens.
#
# GitHub Actions cache is used to speed up builds with layer caching.
# ---------------------------------------------------------------------------
