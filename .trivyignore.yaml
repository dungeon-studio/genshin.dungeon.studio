---
# Trivy suppression file. Every entry needs a justification and an
# expiry date so accepted findings get re-reviewed instead of
# calcifying. Format reference:
# https://aquasecurity.github.io/trivy/latest/docs/configuration/filtering/#trivyignoreyaml
#
# Example:
#   misconfigurations:
#     - id: AVD-AWS-0001
#       paths:
#         - infrastructure/terraform/example.tf
#       statement: Accepted because <reason>; revisit when <condition>.
#       expired_at: 2026-12-31

misconfigurations: []
vulnerabilities: []
secrets: []

# Trivy ignores `purls` on a licence entry, so each entry exempts its licence
# in every package.
licenses:
  - id: LGPL-3.0-only
    statement: >-
      Accepted because eslint-plugin-sonarjs and its
      @sonarsource/analyzer-commons-configurations dependency run only at lint
      time and are never distributed; Trivy scans them because
      @genshin/eslint-config lists them as dependencies. Revisit when
      `pnpm licenses list` shows another LGPL package or the API image becomes
      public.
    expired_at: 2027-10-10
