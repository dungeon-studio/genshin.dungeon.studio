---
# Trivy suppression file. Every entry needs a justification and an
# expiry date so accepted findings get re-reviewed instead of
# calcifying. Format reference:
# https://aquasecurity.github.io/trivy/latest/docs/configuration/filtering/#trivyignoreyaml
#
# Example:
#   misconfigurations:
#     - id: AVD-AWS-0001
#       paths:
#         - infrastructure/terraform/example.tf
#       statement: Accepted because <reason>; revisit when <condition>.
#       expired_at: 2026-12-31

misconfigurations: []
vulnerabilities: []
secrets: []

# Trivy ignores `purls` on a licence entry, so each entry exempts its licence
# in every package.
licenses:
  - id: LGPL-3.0-only
    statement: >-
      eslint-plugin-sonarjs and @sonarsource/analyzer-commons-configurations
      run at lint time and never ship. Trivy counts them as production because
      @genshin/eslint-config declares its plugins as dependencies. On expiry,
      confirm with `pnpm licenses list` that no other package uses LGPL.
    expired_at: 2027-10-10
